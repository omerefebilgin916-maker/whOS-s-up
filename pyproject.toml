[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whosup"
dynamic = ["version"]
description = "whOS's up? - System Status Monitor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
whosup = "whosup.cli:main"

[tool.setuptools.dynamic]
version = { attr = "whosup.__version__" }

[tool.setuptools.packages.find]
include = ["whosup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
